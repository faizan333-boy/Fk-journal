<style>
html{color-scheme:dark;background:#080d18;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--bg:#080d18;--side:#0c1423;--panel:#111d30;--panel2:#17253b;--line:#263750;--text:#e9f0fc;--muted:#8ea0bb;--green:#36d6a0;--red:#ff667d;--blue:#82aaff;--gold:#e8bd6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:700;background:var(--green);color:#062219}button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.red{background:#492333;color:#ffdce3}input,select,textarea{background:#0a1424;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);width:100%}label{font-size:12px;color:var(--muted);display:block;margin:0 0 5px}.muted{color:var(--muted)}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top right,#1c3450 0,transparent 45%),var(--bg)}.authbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:18px;box-shadow:0 20px 80px #0008}.brand{font-size:23px;font-weight:850;letter-spacing:-.5px}.brand b{color:var(--green)}.authbox h1{font-size:24px;margin:25px 0 5px}.authform{display:grid;gap:13px;margin-top:22px}.authswitch{text-align:center;color:var(--muted);margin-top:16px}.authswitch a{color:var(--green);cursor:pointer}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column;gap:22px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:1.5px;margin-top:3px}.navgroup{font-size:10px;color:#62748f;text-transform:uppercase;letter-spacing:1.4px;padding:0 11px;margin-bottom:7px}.nav{display:grid;gap:4px}.nav button{background:transparent;color:#aab8ce;text-align:left;font-weight:600;padding:11px;border-radius:8px}.nav button.active,.nav button:hover{background:#1a2a40;color:#fff}.nav button span{display:inline-block;width:25px;color:var(--green)}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.main{min-width:0}.topbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 27px;gap:12px}.topbar select{width:auto;min-width:120px}.userpill{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.content{max-width:1450px;margin:auto;padding:26px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px}.pagehead h1{font-size:24px;margin:0 0 5px;letter-spacing:-.5px}.pagehead p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px;min-width:0}.statlabel{color:var(--muted);font-size:12px}.statvalue{font-size:25px;font-weight:800;margin-top:9px;letter-spacing:-.5px}.green{color:var(--green)}.redtxt{color:var(--red)}.gold{color:var(--gold)}.row2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}.panel h3{font-size:14px;margin:0 0 15px}.chartbox{height:245px;position:relative}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini .card{padding:13px}.mini strong{display:block;font-size:18px;margin-top:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{width:auto;min-width:135px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}td button{padding:6px 8px;font-size:11px}.empty{text-align:center;padding:35px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formgrid .wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:75px;background:#0c1728;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:11px}.day .pnl{display:block;margin-top:10px;font-weight:700}.dayhead{color:var(--muted);text-align:center;font-size:11px;padding:7px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.insight{border-left:3px solid var(--green);padding:10px 12px;background:#0b1726;border-radius:0 8px 8px 0;margin:9px 0;color:#c8d5e8;line-height:1.5}.tag{font-size:10px;border:1px solid var(--line);border-radius:20px;padding:4px 8px;color:var(--muted)}.notice{padding:11px 13px;border-radius:9px;background:#2b2418;border:1px solid #5d4a29;color:#e9cf9a;font-size:12px;line-height:1.5;margin-bottom:14px}.toast{position:fixed;bottom:18px;right:18px;background:#18352e;border:1px solid #2e8065;padding:12px 16px;border-radius:10px;z-index:10}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:5;padding:10px;display:block;border-right:0;border-bottom:1px solid var(--line)}.sidebar .brand{display:none}.sidebar .navgroup,.sidebottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.nav button span{width:auto;margin-right:5px}.topbar{height:55px;padding:0 15px}.content{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.row2,.twocol{grid-template-columns:1fr}.pagehead{flex-direction:column}.content{padding:14px}.stats{gap:8px}.statvalue{font-size:21px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.topbar{padding:0 12px}}
</style></head><body>
<section id="auth" class="auth"><div class="authbox"><div class="brand">FK<b> JOURNAL</b></div><div class="muted" style="font-size:12px;margin-top:5px">Trading performance workspace</div><h1>Welcome</h1><div class="muted">Login karo — tera data hamesha cloud mein safe rahega.</div><div class="authform"><button id="gBtn" type="button">Continue with Google</button><div class="muted" style="text-align:center">ya email se</div><div><label>Email</label><input id="aEmail" type="email" autocomplete="email"></div><div><label>Password</label><input id="aPass" type="password" autocomplete="current-password" placeholder="Kam se kam 6 characters"></div><div style="display:flex;gap:8px"><button id="aLogin" type="button" style="flex:1">Login</button><button id="aSignup" type="button" class="ghost" style="flex:1">Sign up</button></div></div></div></section>
<div id="app" class="app hidden">
<aside class="sidebar"><div class="brand">FK<b> JOURNAL</b><small>TRADING PERFORMANCE</small></div>
<div><div class="navgroup">Workspace</div><nav class="nav">
<button class="active" data-page="dashboard"><span>▦</span>Dashboard</button><button data-page="trades"><span>⇄</span>Trade log</button><button data-page="calendar"><span>▦</span>Calendar</button><button data-page="analytics"><span>◫</span>Analytics</button><button data-page="journal"><span>▤</span>Daily journal</button><button data-page="strategies"><span>◎</span>Playbook</button><button data-page="plan"><span>☑</span>Trading plan</button><button data-page="coach"><span>✦</span>AI coach</button><button data-page="backup"><span>⛁</span>Import/Export</button></nav></div>

<main class="main"><header class="topbar"><div class="userpill" id="userEmail">FK Journal</div><div style="display:flex;gap:8px;align-items:center"><select id="range"><option value="all">All time</option><option value="30">Last 30 days</option><option value="7">Last 7 days</option></select><button id="quickAdd">＋ Add trade</button><button class="ghost" id="signout">Sign out</button></div></header><div class="content" id="view"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){alert("Storage blocked — data save nahi hoga")}}};try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const SUPABASE_URL = "https://ldfnysbpoxlnimanghxp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZm55c2Jwb3hsbmltYW5naHhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MzI3MTcsImV4cCI6MjExMDAwODcxN30.aDXbqkqqrW2563SJgaDS0fwqTzRUhzOSLGnWHJBVius";
const cloudReady = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_");
const sb = cloudReady && window.supabase ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
const $=id=>document.getElementById(id);let user=null, trades=[], notes=[], strategies=[], plan={}, authMode="login", page="dashboard", equityChart=null, setupChart=null;
const localKey=()=>`fkjournal_main`;
const money=n=>(Number(n)||0).toLocaleString("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2});
const dateNow=()=>new Date().toISOString().slice(0,10);
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2600)}
function result(t){return Number(t.pnl)>0?"Win":Number(t.pnl)<0?"Loss":"BE"}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function startApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=user.email;try{await loadData();render()}catch(e){alert("Data load nahi hua: "+e.message)}}
async function loadData(){if(sb){let [tr,n,s,p]=await Promise.all(["trades","daily_notes","strategies","trading_plan"].map(table=>sb.from(table).select("*")));for(let r of [tr,n,s,p])if(r.error)throw r.error;trades=tr.data||[];notes=n.data||[];strategies=s.data||[];plan=p.data?.[0]||{}}else{let d=JSON.parse(LS.get(localKey())||"{}");trades=d.trades||[];notes=d.notes||[];strategies=d.strategies||[];plan=d.plan||{}}}
async function save(table,obj,id){if(sb){let q=id?sb.from(table).update(obj).eq("id",id):sb.from(table).insert({...obj,user_id:user.id});let {error}=await q;if(error)throw error;await loadData()}else{let d=JSON.parse(LS.get(localKey())||"{}");d[table==="daily_notes"?"notes":table==="trading_plan"?"plan":table]=d[table==="daily_notes"?"notes":table==="trading_plan"?"plan":table]||[];let k=table==="daily_notes"?"notes":table==="trading_plan"?"plan":table;if(table==="trading_plan")d.plan=obj;else if(id)d[k]=d[k].map(x=>x.id===id?{...x,...obj}:x);else d[k].push({...obj,id:crypto.randomUUID()});LS.set(localKey(),JSON.stringify(d));await loadData()}}
async function remove(table,id){if(sb){let {error}=await sb.from(table).delete().eq("id",id);if(error)throw error}else{let d=JSON.parse(LS.get(localKey())||"{}"),k=table==="daily_notes"?"notes":table;d[k]=(d[k]||[]).filter(x=>x.id!==id);LS.set(localKey(),JSON.stringify(d))}await loadData();render()}
$("quickAdd").onclick=()=>{page="trades";render();setTimeout(()=>$("symbol")?.focus(),50)};
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
$("range").onchange=render;
function filtered(){let n=$("range").value;if(n==="all")return trades;let cut=new Date();cut.setDate(cut.getDate()-Number(n));return trades.filter(t=>t.trade_date>=cut.toISOString().slice(0,10))}
function metrics(list){let wins=list.filter(t=>+t.pnl>0),loss=list.filter(t=>+t.pnl<0),grossWin=wins.reduce((s,t)=>s+(+t.pnl),0),grossLoss=Math.abs(loss.reduce((s,t)=>s+(+t.pnl),0)),net=list.reduce((s,t)=>s+(+t.pnl||0),0);return {net,count:list.length,wins:wins.length,losses:loss.length,wr:list.length?wins.length/list.length*100:0,pf:grossLoss?grossWin/grossLoss:grossWin?Infinity:0,avg:list.length?net/list.length:0,grossWin,grossLoss}}
function stat(label,value,cls=""){return `<div class="card"><div class="statlabel">${label}</div><div class="statvalue ${cls}">${value}</div></div>`}
function pageHead(title,sub,btn=""){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${btn}</div>`}
function chart(id,labels,data,type="line"){let ctx=$(id);if(!ctx)return;let existing=Chart.getChart(ctx);if(existing)existing.destroy();new Chart(ctx,{type,data:{labels,datasets:[{label:"Net P&L",data,backgroundColor:"rgba(54,214,160,.15)",borderColor:"#36d6a0",borderWidth:2,fill:type==="line",tension:.3,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#8ea0bb"},grid:{color:"#263750"}},y:{ticks:{color:"#8ea0bb"},grid:{color:"#263750"}}}}})}
function render(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let list=filtered(),m=metrics(list);if(page==="dashboard")dashboard(list,m);if(page==="trades")tradePage();if(page==="calendar")calendarPage();if(page==="analytics")analyticsPage(list,m);if(page==="journal")journalPage();if(page==="strategies")strategyPage();if(page==="plan")planPage();if(page==="coach")coachPage(list,m);if(page==="backup")backupPage()}
function dashboard(list,m){let by={};list.forEach(t=>by[t.trade_date]=(by[t.trade_date]||0)+(+t.pnl));let dates=Object.keys(by).sort();$("view").innerHTML=pageHead("Dashboard","Your trading performance at a glance.",'<button onclick="page=\'trades\';render()">＋ Log a trade</button>')+`<div class="stats">${stat("Net P&L",money(m.net),m.net>=0?"green":"redtxt")}${stat("Win rate",m.wr.toFixed(1)+"%")}${stat("Total trades",m.count)}${stat("Profit factor",m.pf===Infinity?"∞":m.pf.toFixed(2))}</div><div class="row2"><div class="panel"><h3>Equity curve</h3><div class="chartbox"><canvas id="equity"></canvas></div></div><div class="panel"><h3>Performance summary</h3><div class="mini">${stat("Wins",m.wins,"green")}${stat("Losses",m.losses,"redtxt")}${stat("Avg. trade",money(m.avg),m.avg>=0?"green":"redtxt")}</div><div style="margin-top:22px"><div class="statlabel">Gross profit / gross loss</div><div style="font-size:18px;font-weight:750;margin-top:7px">${money(m.grossWin)} <span class="muted">/</span> <span class="redtxt">${money(-m.grossLoss)}</span></div></div><div class="insight">${m.count?`You have logged ${m.count} trades. ${m.wr>=50?"Keep reviewing whether your winning setups are repeatable.":"Focus on execution quality and risk before increasing size."}`:"Log your first trade to unlock performance insights."}</div></div></div><div class="panel"><h3>Recent trades</h3>${tradeTable(trades.slice().sort((a,b)=>b.trade_date.localeCompare(a.trade_date)).slice(0,6),false)}</div>`;
let run=0;let eq=dates.map(d=>{run+=by[d];return +run.toFixed(2)});chart("equity",dates,eq)}
function tradeTable(arr,actions=true){if(!arr.length)return `<div class="empty">No trades found. Add your first trade to get started.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th>Setup</th><th>Entry</th><th>Exit</th><th>R</th><th>Net P&L</th><th>Outcome</th>${actions?"<th></th>":""}</tr></thead><tbody>${arr.map(t=>`<tr><td>${escapeHtml(t.trade_date)}</td><td><b>${escapeHtml(t.symbol)}</b></td><td>${escapeHtml(t.side)}</td><td>${escapeHtml(t.setup||"—")}</td><td>${t.entry??"—"}</td><td>${t.exit??"—"}</td><td>${t.r_multiple??"—"}</td><td class="${+t.pnl>=0?"green":"redtxt"}">${money(t.pnl)}</td><td>${result(t)}</td>${actions?`<td>${/^https:\/\/([a-z]+\.)?tradingview\.com\//.test(t.tv_link||"")?`<a href="${escapeHtml(t.tv_link)}" target="_blank" rel="noopener noreferrer"><button type="button" class="ghost">Chart</button></a> `:""}<button class="ghost" onclick="editTrade('${t.id}')">Edit</button>${t.shot?` <button type="button" class="ghost" onclick="viewShot('${t.id}')">📷</button>`:""} <button class="red" onclick="deleteTrade('${t.id}')">×</button></td>`:""}</tr>`).join("")}</tbody></table></div>`}
function tradePage(){let arr=trades.slice().sort((a,b)=>b.trade_date.localeCompare(a.trade_date));$("view").innerHTML=pageHead("Trade log","Every execution, setup and lesson in one place.",'<a href="https://www.tradingview.com/chart/" target="_blank" rel="noopener noreferrer"><button type="button">Open TradingView</button></a>')+`<div class="panel" style="margin-bottom:14px"><h3 id="tradeFormTitle">＋ Add a trade</h3><form id="tradeForm" class="formgrid"><input type="hidden" id="tradeId"><div><label>Date</label><input id="tradeDate" type="date" value="${dateNow()}" required></div><div><label>Symbol / market</label><input id="symbol" placeholder="XAUUSD, EURUSD, NAS100" required></div><div><label>Side</label><select id="side"><option>Long</option><option>Short</option></select></div><div><label>Session</label><select id="session"><option>London</option><option>New York</option><option>Asia</option><option>Other</option></select></div><div><label>Setup / strategy</label><input id="setup" placeholder="Liquidity sweep, FVG, OB…"></div><div><label>Tags / mistakes</label><input id="tags" placeholder="FOMO, early exit, A+ setup"></div><div class="wide"><label>TradingView chart link (Share > Copy link)</label><input id="tvLink" type="url" placeholder="https://www.tradingview.com/x/..."></div><div class="wide"><label>Screenshot (gallery ya camera se)</label><input id="shot" type="file" accept="image/*"><div id="shotPrev"></div></div><div><label>Entry</label><input id="entry" type="number" step="any"></div><div><label>Exit</label><input id="exit" type="number" step="any"></div><div><label>Stop loss</label><input id="stop" type="number" step="any"></div><div><label>Position size / lots</label><input id="size" type="number" step="any"></div><div><label>Risk amount (₹)</label><input id="risk" type="number" step="any"></div><div><label>Net P&L (₹)</label><input id="pnl" type="number" step="any" required></div><div><label>R multiple (optional)</label><input id="rMultiple" type="number" step="any" placeholder="e.g. 2"></div><div><label>Trade rating</label><select id="rating"><option value="">Not rated</option><option>A+</option><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div class="wide"><label>Trade notes / emotions / execution review</label><textarea id="tradeNotes" rows="2" placeholder="Why did you enter? Did you follow your plan?"></textarea></div><div class="wide actions"><button type="submit">Save trade</button><button type="button" class="ghost" id="cancelTrade">Cancel</button></div></form></div><div class="panel"><div class="toolbar"><input id="tradeSearch" placeholder="Search symbol, setup, tags"><select id="tradeOutcome"><option value="">All outcomes</option><option>Win</option><option>Loss</option><option>BE</option></select></div><div id="tradeRows">${tradeTable(arr)}</div></div>`;
shotData="";$("shot").onchange=pickShot;$("tradeForm").onsubmit=saveTrade;$("cancelTrade").onclick=()=>tradePage();$("tradeSearch").oninput=filterTrades;$("tradeOutcome").onchange=filterTrades}
async function saveTrade(e){e.preventDefault();let id=$("tradeId").value;let obj={trade_date:$("tradeDate").value,symbol:$("symbol").value.trim().toUpperCase(),side:$("side").value,session:$("session").value,setup:$("setup").value,tags:$("tags").value,entry:num("entry"),exit:num("exit"),stop_loss:num("stop"),size:num("size"),risk:num("risk"),pnl:num("pnl"),r_multiple:num("rMultiple"),rating:$("rating").value,notes:$("tradeNotes").value,tv_link:$("tvLink").value.trim(),shot:shotData};try{await save("trades",obj,id||null);toast("Trade saved");render()}catch(e){alert(e.message)}}
function num(id){let v=$(id).value;return v===""?null:Number(v)}
window.editTrade=id=>{let t=trades.find(x=>x.id===id);page="trades";render();setTimeout(()=>{let map={tradeDate:"trade_date",symbol:"symbol",side:"side",session:"session",setup:"setup",tags:"tags",entry:"entry",exit:"exit",stop:"stop_loss",size:"size",risk:"risk",pnl:"pnl",rMultiple:"r_multiple",rating:"rating",tradeNotes:"notes",tvLink:"tv_link"};Object.entries(map).forEach(([a,b])=>$(a).value=t[b]??"");$("tradeId").value=id;shotData=t.shot||"";showShot();$("tradeFormTitle").textContent="Edit trade";window.scrollTo({top:0,behavior:"smooth"})},0)};
window.deleteTrade=async id=>{if(confirm("Delete this trade?")){await remove("trades",id);toast("Trade deleted")}};
function filterTrades(){let q=$("tradeSearch").value.toLowerCase(),r=$("tradeOutcome").value;let a=trades.filter(t=>(!q||[t.symbol,t.setup,t.tags,t.notes].join(" ").toLowerCase().includes(q))&&(!r||result(t)===r)).sort((x,y)=>y.trade_date.localeCompare(x.trade_date));$("tradeRows").innerHTML=tradeTable(a)}
function calendarPage(){let y=new Date().getFullYear(),mo=new Date().getMonth(),first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate(),map={};trades.forEach(t=>map[t.trade_date]=(map[t.trade_date]||0)+(+t.pnl));let cells=Array(first).fill('<div></div>');for(let d=1;d<=days;d++){let k=`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,v=map[k];cells.push(`<div class="day">${d}${v!==undefined?`<span class="pnl ${v>=0?"green":"redtxt"}">${money(v)}</span>`:""}</div>`)}$("view").innerHTML=pageHead("Trading calendar","Daily profit and loss overview.")+`<div class="panel"><h3>${new Date(y,mo).toLocaleString("en",{month:"long",year:"numeric"})}</h3><div class="calendar">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="dayhead">${x}</div>`).join("")}${cells.join("")}</div></div>`}
function analyticsPage(list,m){let setups={};list.forEach(t=>{let k=t.setup||"Uncategorized";setups[k]=(setups[k]||0)+(+t.pnl)});let labels=Object.keys(setups);$("view").innerHTML=pageHead("Analytics","Understand what is working and where your edge leaks.")+`<div class="stats">${stat("Expectancy / trade",money(m.avg),m.avg>=0?"green":"redtxt")}${stat("Average win",money(m.wins?m.grossWin/m.wins:0),"green")}${stat("Average loss",money(m.losses?-m.grossLoss/m.losses:0),"redtxt")}${stat("Gross profit",money(m.grossWin),"green")}</div><div class="twocol"><div class="panel"><h3>P&L by setup</h3><div class="chartbox"><canvas id="setupChart"></canvas></div></div><div class="panel"><h3>Execution breakdown</h3><div class="insight">Win rate: <b>${m.wr.toFixed(1)}%</b></div><div class="insight">Profit factor: <b>${m.pf===Infinity?"∞":m.pf.toFixed(2)}</b></div><div class="insight">Average result: <b>${money(m.avg)}</b></div><div class="insight">Trades logged: <b>${m.count}</b></div></div></div>`;let ctx=$("setupChart");new Chart(ctx,{type:"bar",data:{labels,datasets:[{data:labels.map(x=>setups[x]),backgroundColor:labels.map(x=>setups[x]>=0?"#36d6a0":"#ff667d")}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#8ea0bb"},grid:{display:false}},y:{ticks:{color:"#8ea0bb"},grid:{color:"#263750"}}}}})}
function journalPage(){let today=dateNow(),n=notes.find(x=>x.note_date===today);$("view").innerHTML=pageHead("Daily journal","Record your preparation, mindset and end-of-day review.")+`<div class="panel"><form id="noteForm" class="formgrid"><div><label>Journal date</label><input type="date" id="noteDate" value="${today}"></div><div><label>Mood</label><select id="mood"><option>Focused</option><option>Calm</option><option>Anxious</option><option>FOMO</option><option>Frustrated</option><option>Overconfident</option></select></div><div class="wide"><label>Pre-market plan</label><textarea id="pre" rows="3" placeholder="Bias, key levels, scenarios…">${escapeHtml(n?.pre_market||"")}</textarea></div><div class="wide"><label>Post-session review</label><textarea id="post" rows="3" placeholder="What went well? What needs improvement?">${escapeHtml(n?.review||"")}</textarea></div><div class="wide"><label>Lessons / gratitude</label><textarea id="lesson" rows="2">${escapeHtml(n?.lessons||"")}</textarea></div><div class="wide"><button>Save journal entry</button></div></form></div><div class="panel" style="margin-top:14px"><h3>Past entries</h3>${notes.slice().sort((a,b)=>b.note_date.localeCompare(a.note_date)).map(x=>`<div class="insight"><b>${escapeHtml(x.note_date)}</b> · ${escapeHtml(x.mood||"")}<br>${escapeHtml((x.review||x.pre_market||"").slice(0,150))}</div>`).join("")||'<div class="empty">Your journal entries will appear here.</div>'}</div>`;
$("noteForm").onsubmit=async e=>{e.preventDefault();let d=$("noteDate").value,old=notes.find(x=>x.note_date===d),obj={note_date:d,mood:$("mood").value,pre_market:$("pre").value,review:$("post").value,lessons:$("lesson").value};try{if(sb){if(old){let {error}=await sb.from("daily_notes").update(obj).eq("id",old.id);if(error)throw error;await loadData()}else await save("daily_notes",obj)}else{let data=JSON.parse(LS.get(localKey())||"{}");data.notes=data.notes||[];if(old)data.notes=data.notes.map(x=>x.note_date===d?{...x,...obj}:x);else data.notes.push({...obj,id:crypto.randomUUID()});LS.set(localKey(),JSON.stringify(data));await loadData()}toast("Journal saved");render()}catch(e){alert(e.message)}}}
function strategyPage(){$("view").innerHTML=pageHead("Playbook","Define your setups and track their performance.")+`<div class="panel"><form id="strategyForm" class="formgrid"><div><label>Strategy name</label><input id="stratName" required placeholder="e.g. London liquidity sweep"></div><div><label>Market</label><input id="stratMarket" placeholder="XAUUSD / Forex"></div><div class="wide"><label>Entry checklist / rules</label><textarea id="stratRules" rows="3" placeholder="1. HTF bias aligned…"></textarea></div><div class="wide"><button>Create strategy</button></div></form></div><div class="twocol" style="margin-top:14px">${strategies.map(s=>{let ts=trades.filter(t=>t.setup===s.name),m=metrics(ts);return `<div class="panel"><h3>${escapeHtml(s.name)}</h3><div class="muted">${escapeHtml(s.market||"")}</div><p>${escapeHtml(s.rules||"")}</p><div class="mini">${stat("Trades",m.count)}${stat("Win rate",m.wr.toFixed(0)+"%")}${stat("Net P&L",money(m.net),m.net>=0?"green":"redtxt")}</div><button class="red" style="margin-top:12px" onclick="deleteStrategy('${s.id}')">Delete</button></div>`}).join("")||'<div class="empty">No strategies yet. Add your first playbook.</div>'}</div>`;$("strategyForm").onsubmit=async e=>{e.preventDefault();try{await save("strategies",{name:$("stratName").value,market:$("stratMarket").value,rules:$("stratRules").value});toast("Strategy added");render()}catch(e){alert(e.message)}}}
window.deleteStrategy=async id=>{if(confirm("Delete this strategy?")){await remove("strategies",id)}};
function planPage(){$("view").innerHTML=pageHead("Trading plan","Set your guardrails before the session starts.")+`<div class="notice">This is a personal checklist and tracking aid, not a broker-side risk lock. It cannot prevent orders or guarantee prop-firm compliance.</div><div class="panel"><form id="planForm" class="formgrid"><div><label>Daily profit target (₹)</label><input id="target" type="number" value="${plan.target??""}"></div><div><label>Max daily loss (₹)</label><input id="maxLoss" type="number" value="${plan.max_loss??""}"></div><div><label>Max trades per day</label><input id="maxTrades" type="number" value="${plan.max_trades??""}"></div><div><label>Risk per trade (%)</label><input id="riskPct" type="number" step=".1" value="${plan.risk_pct??""}"></div><div class="wide"><label>My non-negotiable rules</label><textarea id="rules" rows="4">${escapeHtml(plan.rules||"")}</textarea></div><div class="wide"><button>Save trading plan</button></div></form></div><div class="panel" style="margin-top:14px"><h3>Today’s guardrail check</h3><div id="guardrails"></div></div>`;$("planForm").onsubmit=async e=>{e.preventDefault();plan={target:num("target"),max_loss:num("maxLoss"),max_trades:num("maxTrades"),risk_pct:num("riskPct"),rules:$("rules").value};try{if(sb){let {data,error}=await sb.from("trading_plan").select("id").maybeSingle();if(error)throw error;if(data){let {error}=await sb.from("trading_plan").update(plan).eq("id",data.id);if(error)throw error}else{let {error}=await sb.from("trading_plan").insert({...plan,user_id:user.id});if(error)throw error}}else{let d=JSON.parse(LS.get(localKey())||"{}");d.plan=plan;LS.set(localKey(),JSON.stringify(d))}toast("Plan saved");render()}catch(e){alert(e.message)}};let todays=trades.filter(t=>t.trade_date===dateNow()),tm=metrics(todays);$("guardrails").innerHTML=`<div class="insight">Trades today: <b>${todays.length}</b> ${plan.max_trades?`/ ${plan.max_trades}`:""}</div><div class="insight">Today’s P&L: <b class="${tm.net>=0?"green":"redtxt"}">${money(tm.net)}</b> ${plan.max_loss?`· Max loss ${money(plan.max_loss)}`:""}</div>${plan.max_trades&&todays.length>=plan.max_trades?'<div class="insight redtxt">Trade limit reached — review your plan before continuing.</div>':""}${plan.max_loss&&tm.net<=-plan.max_loss?'<div class="insight redtxt">Daily loss limit reached in your journal.</div>':""}`}
function coachPage(list,m){let setups={};list.forEach(t=>{let k=t.setup||"Unspecified";(setups[k]??=[]).push(t)});let insights=[];if(!list.length)insights.push("Log a few trades to let the coach review your actual performance.");else{insights.push(`Your journal contains ${m.count} trades with a ${m.wr.toFixed(1)}% win rate and ${money(m.net)} net P&L.`);let sorted=Object.entries(setups).map(([k,v])=>[k,metrics(v)]).sort((a,b)=>b[1].net-a[1].net);if(sorted.length){insights.push(`Best net-performing setup in this filtered period: ${sorted[0][0]} (${money(sorted[0][1].net)} across ${sorted[0][1].count} trades).`);if(sorted.length>1)insights.push(`Weakest net-performing setup: ${sorted[sorted.length-1][0]} (${money(sorted[sorted.length-1][1].net)}). Review its rules before taking the next similar trade.`)}let tags={};list.forEach(t=>(t.tags||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>tags[x]=(tags[x]||0)+1));let common=Object.entries(tags).sort((a,b)=>b[1]-a[1])[0];if(common)insights.push(`Most frequent tag/mistake: "${common[0]}" (${common[1]} trades). Check whether it clusters around a session or setup.`);if(m.pf<1)insights.push("Gross losses exceed gross profits in this period. Consider reviewing risk sizing and whether your losses are larger than planned.");else insights.push("Your gross profit currently exceeds gross losses. Keep tracking enough trades before drawing conclusions.")} $("view").innerHTML=pageHead("AI coach","Data-grounded journal observations — not trade signals or financial advice.")+`<div class="notice">Coach insights are calculated locally from your journal. This prototype does not call an external AI model or predict market direction.</div><div class="panel"><h3>Performance review</h3>${insights.map(x=>`<div class="insight">✦ ${escapeHtml(x)}</div>`).join("")}<h3 style="margin-top:22px">Ask yourself</h3><div class="insight">Did I follow my setup rules, or did I react to price movement?</div><div class="insight">Was my risk defined before entry, and did I respect it?</div><div class="insight">What one behaviour will I improve in the next session?</div></div>`}

let shotData="";
function pickShot(){let f=$("shot").files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);shotData=c.toDataURL("image/jpeg",.65);showShot()};im.onerror=()=>alert("Image read nahi hui");im.src=r.result};r.readAsDataURL(f)}
function showShot(){let p=$("shotPrev");if(!p)return;p.innerHTML=shotData?`<img src="${shotData}" style="max-width:100%;max-height:180px;border-radius:8px;margin-top:8px"><br><button type="button" class="red" id="shotDel" style="margin-top:6px">Screenshot hatao</button>`:"";if(shotData)$("shotDel").onclick=()=>{shotData="";$("shot").value="";showShot()}}
window.viewShot=id=>{let t=trades.find(x=>x.id===id);if(!t||!t.shot)return;let o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;display:flex;align-items:center;justify-content:center;padding:12px";o.innerHTML=`<img src="${t.shot}" style="max-width:100%;max-height:100%;border-radius:8px">`;o.onclick=()=>o.remove();document.body.appendChild(o)};
function backupPage(){let o={trades:trades.map(({id,user_id,shot,...r})=>r),notes:notes.map(({id,user_id,...r})=>r),strategies:strategies.map(({id,user_id,...r})=>r),plan};$("view").innerHTML=pageHead("Import / Export","Tera data cloud mein safe hai. Ye sirf extra copy aur purana data lane ke liye hai.")+`<div class="panel"><h3>Export (copy)</h3><textarea id="bk" rows="5" readonly>${escapeHtml(JSON.stringify(o))}</textarea><div style="margin-top:10px"><button id="bkCopy">Copy</button></div></div><div class="panel" style="margin-top:14px"><h3>Purana data import karo</h3><textarea id="rs" rows="5" placeholder="Purane FK Journal ka backup text yahan paste karo"></textarea><div style="margin-top:10px"><button id="rsBtn">Import</button></div></div>`;$("bkCopy").onclick=async()=>{try{await navigator.clipboard.writeText($("bk").value);toast("Copied")}catch(e){$("bk").select();toast("Manually copy karo")}};$("rsBtn").onclick=async()=>{try{let v=JSON.parse($("rs").value);for(const [t,a] of [["trades",v.trades],["daily_notes",v.notes],["strategies",v.strategies]]){if(a&&a.length){let {error}=await sb.from(t).insert(a.map(({id,user_id,...r})=>({...r,user_id:user.id})));if(error)throw error}}if(v.plan&&Object.keys(v.plan).length&&!plan.id){let {error}=await sb.from("trading_plan").insert({...v.plan,user_id:user.id});if(error)throw error}await loadData();toast("Import ho gaya");page="dashboard";render()}catch(e){alert("Import fail: "+(e.message||"invalid backup"))}}}
$("gBtn").onclick=async()=>{let {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});if(error)alert(error.message)};
$("aLogin").onclick=async()=>{let {data,error}=await sb.auth.signInWithPassword({email:$("aEmail").value.trim(),password:$("aPass").value});if(error)return alert(error.message);user=data.user;await startApp()};
$("aSignup").onclick=async()=>{let {data,error}=await sb.auth.signUp({email:$("aEmail").value.trim(),password:$("aPass").value});if(error)return alert(error.message);if(!data.session)return alert("Account ban gaya. Email check karke confirm karo, phir Login karo.");user=data.user;await startApp()};
$("signout").onclick=async()=>{await sb.auth.signOut();location.reload()};
(async()=>{if(!sb){alert("Supabase load nahi hua — internet check karo");return}let {data}=await sb.auth.getSession();if(data.session){user=data.session.user;await startApp()}sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_IN"&&s&&!user){user=s.user;startApp()}})})();

</script></body></html>
